            { id: 206, name: "সিরাজ সাঁইয়ের সমাধি", division: "খুলনা", district: "ঝিনাইদহ", lat: 23.7500, lng: 89.3800, type: "মাজার/সমাধি", wikiId: "BD-D-23-108", image: "https://placehold.co/400x300/e2e8f0/475569?text=Siraj+Sai" },
            { id: 207, name: "নলডাঙ্গা মন্দির", division: "খুলনা", district: "ঝিনাইদহ", lat: 23.7600, lng: 89.3900, type: "মন্দির", wikiId: "BD-D-23-109", image: "https://placehold.co/400x300/e2e8f0/475569?text=Naldanga+Temple" },
            { id: 208, name: "মিয়ার দালান জমিদার বাড়ি", division: "খুলনা", district: "ঝিনাইদহ", lat: 23.7700, lng: 89.4000, type: "প্রাসাদ/বাড়ি", wikiId: "BD-D-23-110", image: "https://placehold.co/400x300/e2e8f0/475569?text=Miar+Dalan" }
        ];

        // Mapping of Divisions to their respective Districts in Bengali
        const districtMap = {
            "ঢাকা": ["ঢাকা", "ফরিদপুর", "গাজীপুর", "গোপালগঞ্জ", "কিশোরগঞ্জ", "মাদারীপুর", "মানিকগঞ্জ", "মুন্সীগঞ্জ", "নারায়ণগঞ্জ", "নরসিংদী", "রাজবাড়ী", "শরীয়তপুর", "টাঙ্গাইল", "সাভার"],
            "চট্টগ্রাম": ["বান্দরবান", "ব্রাহ্মণবাড়িয়া", "চাঁদপুর", "চট্টগ্রাম", "কুমিল্লা", "কক্সবাজার", "ফেনী", "খাগড়াছড়ি", "লক্ষ্মীপুর", "নোয়াখালী", "রাঙ্গামাটি"],
            "রাজশাহী": ["বগুড়া", "চাঁপাইনবাবগঞ্জ", "জয়পুরহাট", "নওগাঁ", "নাটোর", "পাবনা", "রাজশাহী", "সিরাজগঞ্জ"],
            "খুলনা": ["বাগেরহাট", "চুয়াডাঙ্গা", "যশোর", "ঝিনাইদহ", "খুলনা", "কুষ্টিয়া", "মাগুরা", "মেহেরপুর", "নড়াইল", "সাতক্ষীরা"],
            "সিলেট": ["হবিগঞ্জ", "মৌলভীবাজার", "সুনামগঞ্জ", "সিলেট"],
            "বরিশাল": ["বরগুনা", "বরিশাল", "ভোলা", "ঝালকাঠি", "পটুয়াখালী", "পিরোজপুর"],
            "রংপুর": ["দিনাজপুর", "গাইবান্ধা", "কুড়িগ্রাম", "লালমনিরহাট", "নীলফামারী", "পঞ্চগড়", "রংপুর", "ঠাকুরগাঁও"],
            "ময়মনসিংহ": ["জামালপুর", "ময়মনসিংহ", "নেত্রকোনা", "শেরপুর"]
        };

        let map;
        let markers = [];
        let currentDivisionFilter = 'all';
        let currentDistrictFilter = 'all';
        let currentTypeFilter = 'all';

        function initMap() {
            // Center map on Bangladesh
            map = L.map('map').setView([23.6850, 90.3563], 7);

            // Add OpenStreetMap tiles
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 18,
            }).addTo(map);

            // Load FontAwesome for icons dynamically if not present
            if (!document.getElementById('fontawesome')) {
                const faLink = document.createElement('link');
                faLink.id = 'fontawesome';
                faLink.rel = 'stylesheet';
                faLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
                document.head.appendChild(faLink);
            }

            // Populate initial markers and list
            renderMarkers(monumentsData);
            renderList(monumentsData);

            // Hide loading overlay
            document.getElementById('loading-overlay').style.display = 'none';

            // Populate category dropdown dynamically
            const types = [...new Set(monumentsData.map(m => m.type))].sort();
            const typeSelect = document.getElementById('type-filter');
            types.forEach(type => {
                const option = document.createElement('option');
                option.value = type;
                option.textContent = type;
                typeSelect.appendChild(option);
            });

            // Set up event listeners
            document.getElementById('division-filter').addEventListener('change', handleDivisionChange);
            document.getElementById('district-filter').addEventListener('change', handleDistrictChange);
            document.getElementById('type-filter').addEventListener('change', handleTypeChange);
        }

        // Helper function to focus map on a marker with an offset so it stays centered
        function focusOnLocationWithOffset(lat, lng, marker, zoomLevel = 14) {
            // Close any currently open popups to prevent autoPan conflicts
            map.closePopup();
            
            // Calculate pixel offset
            const targetPoint = map.project([lat, lng], zoomLevel);
            targetPoint.y -= 150; // Offset Y by 150 pixels to account for popup height
            
            // Convert back to lat/lng
            const targetLatLng = map.unproject(targetPoint, zoomLevel);
            
            map.flyTo(targetLatLng, zoomLevel, {
                duration: 1.0
            });
            
            if (marker) {
                map.once('moveend', () => {
                    marker.openPopup();
                });
            }
        }

        function getIconConfigForType(type) {
            let iconClass = 'fa-monument';
            let bgClass = 'marker-default';

            const lowerType = type.toLowerCase();
            if (lowerType.includes('মসজিদ') || lowerType.includes('ইমামবাড়া')) {
                iconClass = 'fa-mosque';
                bgClass = 'marker-mosque';
            } else if (lowerType.includes('মন্দির') || lowerType.includes('মঠ') || lowerType.includes('ধাম')) {
                iconClass = 'fa-vihara'; 
                bgClass = 'marker-temple';
            } else if (lowerType.includes('প্রাসাদ') || lowerType.includes('বাড়ি') || lowerType.includes('ভবন') || lowerType.includes('কমপ্লেক্স')) {
                iconClass = 'fa-chess-rook';
                bgClass = 'marker-palace';
            } else if (lowerType.includes('প্রত্নতাত্ত্বিক') || lowerType.includes('ঢিবি') || lowerType.includes('হাম্মামখানা')) {
                iconClass = 'fa-landmark';
                bgClass = 'marker-archaeological';
            } else if (lowerType.includes('দুর্গ')) {
                iconClass = 'fa-chess-rook';
                bgClass = 'marker-fort';
            } else if (lowerType.includes('জাদুঘর') || lowerType.includes('সংগ্রহশালা')) {
                iconClass = 'fa-building-columns';
                bgClass = 'marker-museum';
            } else if (lowerType.includes('সমাধি') || lowerType.includes('মাজার') || lowerType.includes('দরগাহ') || lowerType.includes('আখড়া')) {
                iconClass = 'fa-place-of-worship'; 
                bgClass = 'marker-tomb';
            } else if (lowerType.includes('গির্জা')) {
                iconClass = 'fa-church';
                bgClass = 'marker-default'; 
            }

            return {
                html: `<div class="custom-marker-icon ${bgClass}" style="width: 30px; height: 30px;">
                        <i class="fa-solid ${iconClass}"></i>
                       </div>`,
                className: '', 
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -15]
            };
        }

        function renderMarkers(data) {
            // Clear existing markers
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            data.forEach(monument => {
                const customIcon = L.divIcon(getIconConfigForType(monument.type));
                const marker = L.marker([monument.lat, monument.lng], { icon: customIcon }).addTo(map);
                
                const popupContent = `
                    <div class="max-w-[250px]">
                        <img src="${monument.image}" alt="${monument.name}" class="w-full h-32 object-cover rounded-md mb-3 border border-slate-200">
                        <h3 class="font-bold text-lg text-slate-900 mb-1 leading-tight">${monument.name}</h3>
                        <div class="text-sm text-slate-600 mb-2">
                            <p><span class="font-semibold">ধরন:</span> 
                                <span class="inline-flex items-center gap-1">
                                    ${getIconConfigForType(monument.type).html.replace('style="width: 30px; height: 30px;"', 'style="width: 16px; height: 16px; font-size: 8px; display: inline-flex;"')}
                                    ${monument.type}
                                </span>
                            </p>
                            <p><span class="font-semibold">অবস্থান:</span> ${monument.district}, ${monument.division}</p>
                            <p><span class="font-semibold">আইডি:</span> <code class="bg-slate-100 px-1 py-0.5 rounded text-xs">${monument.wikiId}</code></p>
                        </div>
                        <a href="#" class="inline-block w-full text-center px-3 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 hover:text-blue-800 rounded text-sm font-medium transition-colors border border-blue-200">এই আইডির জন্য ছবি আপলোড করুন</a>
                    </div>
                `;
                
                marker.bindPopup(popupContent, {
                    maxWidth: 260,
                    className: 'custom-popup',
                    autoPan: false
                });
                
                marker.on('click', () => {
                    focusOnLocationWithOffset(monument.lat, monument.lng, marker);
                });

                markers.push(marker);
            });
            
            if(markers.length > 0) {
                 const group = new L.featureGroup(markers);
                 map.fitBounds(group.getBounds(), {padding: [30, 30]});
            }
        }

        function renderList(data) {
            const listContainer = document.getElementById('monument-list');
            const countContainer = document.getElementById('result-count');
            
            listContainer.innerHTML = '';
            
            // Update the total count dynamically
            countContainer.textContent = `মোট স্থাপনা: ${data.length}`;

            if (data.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center p-6 text-slate-500 mt-10">
                        <svg class="mx-auto h-12 w-12 text-slate-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <p>ফিল্টারের সাথে মিলে এমন কোনো স্থাপনা পাওয়া যায়নি।</p>
                    </div>`;
                return;
            }

            data.forEach((monument, index) => {
                const item = document.createElement('div');
                item.className = 'p-3 mb-2 bg-white rounded-md shadow-sm cursor-pointer transition-all border border-slate-100 hover:border-blue-300 hover:shadow-md group';
                
                const iconConfig = getIconConfigForType(monument.type);
                const smallIconHtml = iconConfig.html.replace('style="width: 30px; height: 30px;"', 'style="width: 24px; height: 24px; font-size: 12px; flex-shrink: 0;"');

                item.innerHTML = `
                    <div class="flex items-start gap-3">
                        ${smallIconHtml}
                        <div class="flex-grow">
                            <h4 class="font-medium text-slate-900 leading-tight group-hover:text-blue-700 transition-colors">${monument.name}</h4>
                            <p class="text-xs text-slate-500 mt-1 flex items-center gap-1">
                                <i class="fa-solid fa-location-dot text-slate-400 text-[10px]"></i>
                                ${monument.district}, ${monument.division}
                            </p>
                        </div>
                    </div>
                `;
                
                item.addEventListener('click', () => {
                    focusOnLocationWithOffset(monument.lat, monument.lng, markers[index]);
                });

                listContainer.appendChild(item);
            });
        }

        function updateDistrictDropdown(division) {
            const districtSelect = document.getElementById('district-filter');
            districtSelect.innerHTML = ''; 

            if (division === 'all') {
                districtSelect.innerHTML = '<option value="all">প্রথমে একটি বিভাগ নির্বাচন করুন</option>';
                districtSelect.disabled = true;
                currentDistrictFilter = 'all';
            } else {
                districtSelect.disabled = false;
                districtSelect.innerHTML = '<option value="all">সকল জেলা</option>';
                
                const districts = districtMap[division] || [];
                districts.sort().forEach(dist => {
                    const option = document.createElement('option');
                    option.value = dist;
                    option.textContent = dist;
                    districtSelect.appendChild(option);
                });
            }
        }

        function filterData() {
            let filteredData = monumentsData;
            
            if (currentDivisionFilter !== 'all') {
                filteredData = filteredData.filter(m => m.division === currentDivisionFilter);
            }
            
            if (currentDistrictFilter !== 'all') {
                filteredData = filteredData.filter(m => m.district === currentDistrictFilter);
            }

            if (currentTypeFilter !== 'all') {
                filteredData = filteredData.filter(m => m.type === currentTypeFilter);
            }
            
            renderMarkers(filteredData);
            renderList(filteredData);
        }

        function handleDivisionChange(e) {
            currentDivisionFilter = e.target.value;
            currentDistrictFilter = 'all'; // Reset district when division changes
            
            updateDistrictDropdown(currentDivisionFilter);
            filterData();
        }

        function handleDistrictChange(e) {
            currentDistrictFilter = e.target.value;
            filterData();
        }

        function handleTypeChange(e) {
            currentTypeFilter = e.target.value;
            filterData();
        }

        function zoomToFullMap() {
            // Reset filters
            document.getElementById('division-filter').value = 'all';
            document.getElementById('district-filter').value = 'all';
            document.getElementById('type-filter').value = 'all';
            currentDivisionFilter = 'all';
            currentDistrictFilter = 'all';
            currentTypeFilter = 'all';
            
            updateDistrictDropdown('all');
            filterData();
            
            // Default center and zoom for Bangladesh
            map.flyTo([23.6850, 90.3563], 7, {
                duration: 1.5
            });
            map.closePopup();
        }

        // Initialize map when DOM is fully loaded
        document.addEventListener('DOMContentLoaded', initMap);

    </script>
</body>
</html>
